
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa AI | Smart Assistant</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">✦ Nexa<span>AI</span></div>
    <button class="new-chat" onclick="newChat()">＋ New conversation</button>
    <p class="side-label">YOUR WORKSPACE</p>
    <div id="history"></div>
    <div class="side-bottom">✦ Powered by your ideas</div>
  </aside>

  <main class="main">
    <header>
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="model">Nexa AI <span>Assistant</span></div>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">◐</button>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="orb">✦</div>
        <h1>Imagine something.<br><span>Let's build it.</span></h1>
        <p>Your intelligent workspace for ideas, code and creativity.</p>
        <div class="suggestions">
          <button onclick="suggest('Write a Python program')">⌘ Write code</button>
          <button onclick="suggest('Give me a creative project idea')">✧ Explore ideas</button>
          <button onclick="suggest('Explain artificial intelligence')">◈ Learn AI</button>
        </div>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" placeholder="Message Nexa AI..." required></textarea>
      <div class="composer-bottom">
        <span>✦ Your ideas, one conversation at a time</span>
        <div>
          <button type="button" class="icon-btn" id="voiceBtn"
            onclick="voiceInput()" title="Voice input">🎙</button>
          <button class="send" type="submit" title="Send message">↑</button>
        </div>
      </div>
    </form>
    <p class="disclaimer">AI responses may be inaccurate. Verify important information.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
